services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: clipping
      POSTGRES_USER: clipping
      POSTGRES_PASSWORD: clipping
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: sns,sqs
    ports:
      - "4566:4566"

volumes:
  pgdata: